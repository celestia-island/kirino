name: Checks

on:
  workflow_dispatch:
  workflow_call: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_GIT_FETCH_WITH_CLI: true

jobs:
  check:
    name: Check
    runs-on: [self-hosted, linux, x64, local]
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Check compilation
        run: cargo check -p kirino-session -p kirino -p kirino-macro --lib

      - name: Run tests
        run: cargo test -p kirino-session -p kirino -p kirino-macro

      - name: Generated TypeScript bindings are up to date
        # The `ts` feature turns every `#[ts(export)]` into an export test that
        # rewrites `packages/web_ts/src/generated/*.ts` from the Rust
        # declarations. A committed binding that lags its declaration — or a
        # new type whose binding was never committed — shows up here.
        run: |
          cargo test -p kirino --lib --features ts export_bindings
          git diff --exit-code --stat -- packages/web_ts/src/generated
          test -z "$(git ls-files --others --exclude-standard -- packages/web_ts/src/generated)"
          # A type exported without `export_to` lands at the crate root instead.
          test -z "$(git ls-files --others --exclude-standard -- '*.ts')"

  web_ts:
    name: Check the TypeScript package
    runs-on: [self-hosted, linux, x64, local]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11
      # The contract test under tests/ is only evidence if something runs it:
      # typecheck (tests included), vitest, then the publish build (which must
      # not ship test files).
      - name: Typecheck, test, build
        run: |
          cd packages/web_ts
          pnpm install --frozen-lockfile
          pnpm run typecheck
          pnpm test
          pnpm run build
          test -z "$(find dist -name '*.test.*')"

  verify-versions:
    name: Verify version consistency
    uses: celestia-island/celestia-devtools/.github/workflows/verify-versions.yml@c45f1881e00cb55d0a2a1fcf57b28734ece119bb
    with:
      devtools-ref: c45f1881e00cb55d0a2a1fcf57b28734ece119bb

  family-versions:
    name: Family dependency identity
    uses: celestia-island/celestia-devtools/.github/workflows/family-versions.yml@c45f1881e00cb55d0a2a1fcf57b28734ece119bb
    with:
      devtools-ref: c45f1881e00cb55d0a2a1fcf57b28734ece119bb
