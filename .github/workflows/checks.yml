name: Checks

on:
  workflow_dispatch:
  push:
    branches: [master]
  pull_request:
    types: [opened, reopened, ready_for_review]
  workflow_call: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_GIT_FETCH_WITH_CLI: true

jobs:
  check:
    name: Check
    runs-on: [self-hosted, linux, x64, local]
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.toml') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Check compilation
        run: cargo check -p kirino-session -p kirino -p kirino-macro --lib

      - name: Run tests
        run: cargo test -p kirino-session -p kirino -p kirino-macro

  verify-versions:
    name: Verify version consistency
    uses: celestia-island/celestia-devtools/.github/workflows/verify-versions.yml@master
