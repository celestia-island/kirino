name: CI (GitHub-hosted)

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_GIT_FETCH_WITH_CLI: true

jobs:
  check:
    name: Check + test (hosted)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      # kirino depends on the private yuuka crate; GITHUB_TOKEN cannot read
      # other private org repos. Configure a PAT-backed insteadOf rewrite
      # when the GH_PAT secret is present (add it in repo settings).
      - name: Configure private git access
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          if [ -n "$GH_PAT" ]; then
            git config --global url."https://x-access-token:${GH_PAT}@github.com/".insteadOf "https://github.com/"
          fi

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/
          key: ${{ runner.os }}-hosted-cargo-${{ hashFiles('**/Cargo.toml') }}
          restore-keys: ${{ runner.os }}-hosted-cargo-

      - name: Check compilation
        run: cargo check -p kirino-session -p kirino -p kirino-macro --lib

      - name: Run tests
        run: cargo test -p kirino-session -p kirino -p kirino-macro

      - name: Run tests, every feature
        # The default-feature run above never compiles the modules that sit
        # behind an off-by-default feature: the OAuth relying-party core
        # (`auth-oauth`) and kirino-session's relay session (`relay`) are
        # invisible to it — an unused import in either shipped green
        # (kirino #219, review round 1). This step is the justfile's own
        # `test` shape, so CI and the local recipe compile the same code.
        run: cargo test --workspace --all-features

  lint:
    name: fmt + clippy (hosted)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Configure private git access
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          if [ -n "$GH_PAT" ]; then
            git config --global url."https://x-access-token:${GH_PAT}@github.com/".insteadOf "https://github.com/"
          fi

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/
          key: ${{ runner.os }}-hosted-cargo-${{ hashFiles('**/Cargo.toml') }}
          restore-keys: ${{ runner.os }}-hosted-cargo-

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Clippy lints
        # --all-features for the same reason as the every-feature test step:
        # dead-code and unused-import lints only fire where gated modules compile.
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
