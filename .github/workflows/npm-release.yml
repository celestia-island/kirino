name: npm Release

# Publishes `@celestia-island/kirino`. The trigger is the crate release tag
# `v<version>` (the same tag `publish.yml` uses for the crates.io line), not the
# historical `kirino_session-v*` prefix: no tag in this repository ever carried
# that prefix, so the tag path could never fire and the npm binding silently sat
# one release behind the crate (0.7.9 vs 0.7.10, 2026-10-24 audit UP-03).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (e.g. 0.7.10)"
        required: true

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish @celestia-island/kirino to npm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org/
      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11

      - name: Install dependencies
        run: |
          cd packages/web_ts
          pnpm install --frozen-lockfile

      - name: Build
        run: |
          cd packages/web_ts
          pnpm run build
      - name: Resolve version
        id: ver
        shell: bash
        # Every version value — the dispatch input and the tag name — is
        # untrusted input. It reaches the script only through `env`, never by
        # `${{ }}` interpolation into the script body (that is command
        # injection), and must be a single line before anything consumes it.
        env:
          DISPATCH_VERSION: ${{ github.event.inputs.version }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          if [ -n "${DISPATCH_VERSION}" ]; then
            v="${DISPATCH_VERSION}"
          else
            v="${TAG_NAME#v}"
          fi
          case "${v}" in
            *$'\n'*|*$'\r'*) echo "::error::version must be a single line"; exit 1;;
          esac
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - name: The tag must name the crate's version
        # This lane publishes whatever the `v*` tag says. A tag that does not
        # match the workspace version would put a number on npm that the
        # Cargo manifest and `.versions.toml` never declared.
        env:
          # Through `env`, never inline: the tag name is untrusted input and
          # must not be interpolated into the script body (it would be parsed
          # as shell / regex syntax). `-F` matches it as a literal.
          TAG_VERSION: ${{ steps.ver.outputs.version }}
        run: |
          grep -Fqx "version = \"${TAG_VERSION}\"" Cargo.toml || {
            echo "::error::tag v${TAG_VERSION} does not match the crate version in Cargo.toml"; exit 1; }
      - name: Check whether this version is already on npm
        id: exists
        env:
          VER: ${{ steps.ver.outputs.version }}
        run: |
          PKG="@celestia-island/kirino"
          if curl -fsS "https://registry.npmjs.org/${PKG}/${VER}" >/dev/null; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "::warning::${PKG}@${VER} is already on npm — skipping."
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Bump version
        if: steps.exists.outputs.published != 'true'
        env:
          VER: ${{ steps.ver.outputs.version }}
        run: |
          cd packages/web_ts
          npm version "${VER}" --no-git-tag-version --allow-same-version
      - name: Publish
        if: steps.exists.outputs.published != 'true'
        run: |
          cd packages/web_ts
          pnpm publish --access public --provenance --no-git-checks
