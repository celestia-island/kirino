name: npm Release

# Publishes `@celestia-island/kirino`. The trigger is the crate release tag
# `v<version>` (the same tag `publish.yml` uses for the crates.io line), not the
# historical `kirino_session-v*` prefix: no tag in this repository ever carried
# that prefix, so the tag path could never fire and the npm binding silently sat
# one release behind the crate (0.7.9 vs 0.7.10, 2026-10-24 audit UP-03).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (e.g. 0.7.10)"
        required: true

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish @celestia-island/kirino to npm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org/
      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11

      - name: Install dependencies
        run: |
          cd packages/web_ts
          pnpm install --frozen-lockfile

      - name: Build
        run: |
          cd packages/web_ts
          pnpm run build
      - name: Resolve version
        id: ver
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            v="${{ github.event.inputs.version }}"
          else
            v="${GITHUB_REF_NAME#v}"
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - name: Check whether this version is already on npm
        id: exists
        run: |
          PKG="@celestia-island/kirino"
          VER="${{ steps.ver.outputs.version }}"
          if curl -fsS "https://registry.npmjs.org/${PKG}/${VER}" >/dev/null; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "::warning::${PKG}@${VER} is already on npm — skipping."
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Bump version
        if: steps.exists.outputs.published != 'true'
        run: |
          cd packages/web_ts
          npm version "${{ steps.ver.outputs.version }}" --no-git-tag-version --allow-same-version
      - name: Publish
        if: steps.exists.outputs.published != 'true'
        run: |
          cd packages/web_ts
          pnpm publish --access public --provenance --no-git-checks
