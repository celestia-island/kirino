name: Lint

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_GIT_FETCH_WITH_CLI: true

jobs:
  lint:
    name: fmt + clippy
    runs-on: [self-hosted, linux, x64, local]
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Clippy lints
        # --all-features for the same reason as the every-feature test step:
        # dead-code and unused-import lints only fire where gated modules compile.
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  deny:
    name: cargo-deny
    runs-on: [self-hosted, linux, x64, local]
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-deny
        run: |
          curl -fsSL https://github.com/EmbarkStudios/cargo-deny/releases/download/0.20.2/cargo-deny-0.20.2-x86_64-unknown-linux-musl.tar.gz | tar xz -C /tmp
          echo "/tmp/cargo-deny-0.20.2-x86_64-unknown-linux-musl" >> "$GITHUB_PATH"
      - name: cargo-deny (advisories)
        run: cargo deny check advisories
      - name: cargo-deny (licenses)
        run: cargo deny check licenses
      - name: cargo-deny (sources)
        run: cargo deny check sources
