name: Publish crates.io

on:
  push:
    tags: [v*]

jobs:
  publish:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Clone yuuka (workspace dep)
        run: git clone --depth 1 https://github.com/celestia-island/yuuka.git ../yuuka
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.CARGO_HOME }}
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.toml') }}
          restore-keys: ${{ runner.os }}-cargo-
      - run: cargo check -p kirino-session -p kirino -p kirino-macro --lib
      - name: Install celestia-devtools
        run: pip install git+https://github.com/celestia-island/celestia-devtools.git
      - run: cargo login ${{ secrets.CRATES_IO_API_TOKEN }}
      - run: python -m celestia_devtools.publish.crates
