name: Publish crates.io

on:
  push:
    tags: [v*]
  # Manual re-run: a tag whose gate failed (crates.io publish is skipped but
  # the tag stays) can be re-dispatched after a workflow fix without moving
  # the tag.
  workflow_dispatch:

jobs:
  # Semver gate first: a tag whose API diff requires a bigger bump must
  # never reach crates.io (versioning-audit B2, 2026-11-04; the plana
  # accident class). Pinned devtools ref per H14.
  semver-checks:
    name: Semver API diff (published crates)
    uses: celestia-island/celestia-devtools/.github/workflows/semver-checks.yml@f39afe4c782e4bcf66d2aca291274624afa615dd
    with:
      runs-on-json: '["ubuntu-latest"]'
      # semver-checks builds the crates.io BASELINE with ALL features enabled
      # (its heuristic enables everything except unstable/nightly/bench/
      # no_std/_-prefixed). kirino-session 0.8.0's `actix` feature middleware
      # uses `use futures::…` while the manifest only ever declared
      # `futures-util` — that baseline cannot build its own rustdoc, and the
      # v0.9.8 tag failed here (run 45580885762). Scoping both sides to the
      # crate-defined default features keeps the build alive; the trade-off —
      # feature-set API diffs are outside this gate's view — is recorded in
      # the waiver for this release.
      feature-flags: '{"kirino-session": "--default-features"}'

  publish:
    name: Publish to crates.io
    needs: semver-checks
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Clone yuuka (workspace dep)
        run: git clone --depth 1 https://github.com/celestia-island/yuuka.git ../yuuka
      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.toml') }}
          restore-keys: ${{ runner.os }}-cargo-
      - run: cargo check -p kirino-session -p kirino -p kirino-macro --lib
      - name: Install celestia-devtools
        run: pip install git+https://github.com/celestia-island/celestia-devtools.git
      - run: cargo login ${{ secrets.CRATES_IO_API_TOKEN }}
      - run: python -m celestia_devtools.publish.crates
