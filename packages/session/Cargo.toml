[package]
name = "kirino-session"
# 0.8.0 (2026-11-03): the deliberate asymmetric-line release the 0.7.0 park
# was waiting for — Ed25519 plus the optional ML-DSA-65 profile (feature
# `mldsa`, RFC 9964 wire format). Semver-breaking relative to 0.7 by design;
# the park note below is the historical rationale, kept for archaeology:
#   parked at the published 0.7.0 on purpose (user decision, 2026-09-26) so
#   the release helper would SKIP this crate on v0.7.x tags; un-parked by the
#   PQ W1 ruling (PLAN [[pq-kirino]], PR #177).
version = "0.8.0"
edition = "2021"
rust-version = "1.75"
description = "Distributed session management with JWT and PostgreSQL for kirino"
license-file = "../../LICENSE"
repository = "https://github.com/celestia-island/kirino"
documentation = "https://docs.rs/kirino-session"
keywords = ["session", "jwt", "authentication", "kirino"]

[lints]
workspace = true

[dependencies]
serde = { version = "^1", features = ["derive"] }
serde_json = "^1"
base64 = "^0.22"
jsonwebtoken = { version = "^11", features = ["rust_crypto"] }
uuid = { version = "^1", features = ["v4", "v7", "serde"] }
chrono = { version = "^0.4", features = ["serde"] }
tokio = { version = "^1", features = ["sync", "rt"] }
tracing = { version = "^0.1" }
thiserror = "^2"
sea-orm = { version = "^2", optional = true, features = ["sqlx-postgres", "runtime-tokio-rustls"] }
zeroize = { version = "^1", features = ["zeroize_derive"] }
ml-dsa = { version = "^0.1", optional = true }
axum = { version = "^0.8", optional = true }
axum-core = { version = "^0.5", optional = true }
actix-web = { version = "^4", optional = true }
actix-rt = { version = "^2", optional = true }
futures-util = { version = "^0.3", optional = true }

[features]
default = ["axum"]
postgres = ["sea-orm"]
axum = ["dep:axum", "dep:axum-core"]
actix = ["dep:actix-web", "dep:actix-rt", "dep:futures-util"]
# Post-quantum ML-DSA-65 profile (FIPS 204 / RFC 9964). Default-off on
# purpose: the crate's `rust-version` stays 1.75 for everything else,
# while `mldsa` needs a toolchain >= 1.87 (ml-dsa MSRV).
mldsa = ["dep:ml-dsa"]

[dev-dependencies]
tokio = { version = "^1", features = ["full"] }
axum = { version = "^0.8", features = ["ws"] }
serde = { version = "^1", features = ["derive"] }
serde_json = "^1"
uuid = { version = "^1", features = ["v4"] }

[[example]]
name = "axum_ws_one_shot"
path = "examples/axum_ws_one_shot.rs"

[[example]]
name = "session_restore"
path = "examples/session_restore.rs"
