[package]
name = "kirino"
version.workspace = true
edition = "2021"
description = "Zero-trust authentication and authorization framework with RBAC and dynamic risk assessment."
license-file = "LICENSE"
repository = "https://github.com/celestia-island/kirino"
readme = "README.md"
documentation = "https://docs.rs/kirino"
categories = ["authentication"]
keywords = ["rbac", "authentication", "authorization", "zero-trust", "anomaly-detection"]
rust-version = "1.94"

[lints]
workspace = true

[workspace]
members = [
    "packages/session",
    "packages/kirino-macro",
]

[workspace.package]
version = "0.9.10"

[lib]
crate-type = ["rlib"]

[features]
default = ["rbac-inmemory", "auth-password", "auth-jwt"]
rbac-core = []
rbac-inmemory = ["rbac-core"]
rbac-hierarchy = ["rbac-core"]
rbac-constraints = ["rbac-core"]
rbac-db-session = ["rbac-core", "dep:lacrymira", "dep:lacrymira-pg"]
rbac-dynamic = ["rbac-core"]
rbac-full = ["rbac-inmemory", "rbac-hierarchy", "rbac-constraints", "rbac-dynamic", "auth-password", "auth-jwt", "auth-webauthn", "auth-oauth"]
auth-password = ["dep:argon2"]
auth-jwt = ["dep:jsonwebtoken"]
auth-webauthn = ["dep:coset", "dep:p256"]
# DB-backed single-use credential store: the atomic claim is one SQL
# statement, so a credential parked on one replica is claimable from any
# other. Off by default; a single-replica deployment uses the in-memory
# store in `auth::store::memory`.
store-db = ["dep:lacrymira", "dep:lacrymira-pg"]
# TypeScript bindings for the wire contract types (generated; never hand-written).
ts = ["dep:ts-rs"]
# Relay (designated external login source): the relying-party protocol core
# (PKCE, state, token exchange, ID-token verification). Off by default;
# transport is injected by the host (kirino opens no sockets).
auth-oauth = ["dep:base64", "dep:subtle", "auth-jwt"]
# The OAuth 2.0 / OIDC *provider* (OP) core: client registry policy, the
# authorization decision, the code grant, ID-token signing, UserInfo and
# the discovery/JWKS documents. Pure logic — no HTTP, no storage. Off by
# default; a host wires it to its own router and ConsumableStore.
auth-oidc-provider = ["auth-oauth"]
auth-mfa = ["auth-password"]
auth-dpop = ["auth-jwt", "dep:base64"]
auth-mtls = ["dep:base64"]

[dependencies]
anyhow = "^1"
async-trait = "^0.1"
thiserror = "^2"
chrono = { version = "^0.4", features = ["serde"] }
tokio = { version = "^1", features = ["sync", "macros", "rt", "time"] }
uuid = { version = "^1", features = ["serde", "v4", "v7"] }
futures = "^0.3"
serde = { version = "^1", features = ["derive"] }
serde_json = "^1"
# Published family crate -> crates.io per the 2026-10-20 registry-first ruling.
yuuka = "^0.6"
kirino-macro = { path = "packages/kirino-macro", version = "0.9" }
argon2 = { version = "^0.5", optional = true }
hmac = "^0.13"
jsonwebtoken = { version = "^11", features = ["rust_crypto"], optional = true }
rand = "^0.10"
sha1 = "^0.11"
zeroize = { version = "^1", features = ["zeroize_derive"] }
sha2 = "^0.11"
hex = "^0.4"
coset = { version = "^0.4", optional = true }
p256 = { version = "^0.14", features = ["ecdsa", "getrandom"], optional = true }
ts-rs = { version = "^12", optional = true }
# URL parsing for the always-on relay configuration; small, and already in
# the lock graph through other dependencies.
url = "^2"
base64 = { version = "^0.22", optional = true }
# Constant-time comparison for the PKCE verifier check; already in the graph.
subtle = { version = "^2", optional = true }
tracing = { version = "^0.1", features = ["log"] }
# Raw-SQL data access goes through the family data layer (lacrymira);
# the pg executor brings sqlx, so the feature stays optional.
lacrymira = { version = "^0.2", optional = true }
lacrymira-pg = { version = "^0.2", optional = true }

[dev-dependencies]
criterion = "^0.8"
# Test-only: mints ID tokens signed with a freshly generated Ed25519 key.
ed25519-dalek = "^2"
tokio = { version = "^1", features = ["rt", "rt-multi-thread", "macros", "time", "sync"] }

[[bench]]
name = "rbac"
harness = false

[workspace.lints.rust]
warnings = "deny"

[workspace.lints.clippy]
all = "deny"
